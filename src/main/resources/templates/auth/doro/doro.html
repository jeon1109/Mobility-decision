<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MOBIUS AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-[#fff7f7] text-slate-900">

<main class="max-w-6xl mx-auto px-6 py-8">

    <header class="flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="text-4xl font-black text-rose-500">M</div>
            <div>
                <h1 class="font-black text-xl">MOBIUS AI</h1>
                <p class="text-xs text-slate-500">AI 이동 전략 비서</p>
            </div>
        </div>

    </header>

    <section class="grid md:grid-cols-2 gap-10 items-center mt-12">
        <div>
            <p class="text-rose-500 font-bold text-xl">누구나 쉽고 편리하게!</p>

            <h2 class="text-5xl md:text-6xl font-black leading-tight mt-4">
                국가교통 데이터를 활용한<br>
                <span class="text-rose-500">AI</span> 이동 전략 추천
            </h2>

            <p class="mt-6 text-slate-600 leading-relaxed">
                실시간 교통·날씨·혼잡도 데이터를 분석하여<br>
                당신의 상황에 맞는 최적의 이동 전략을 추천합니다.
            </p>
        </div>

        <div class="bg-rose-100 rounded-[2rem] p-10 text-center">
            <div class="text-8xl">🚇</div>
            <p class="mt-5 font-black text-2xl">실시간 데이터 기반 이동 브리핑</p>
            <p class="mt-2 text-slate-500">혼잡도 · 날씨 · 도로소통 분석</p>
        </div>
    </section>

    <section class="mt-10 bg-white/80 rounded-[2rem] p-8 shadow-sm border border-rose-100">
        <form action="/api/recommend" method="post" class="space-y-8">

            <div>
                <h3 class="font-black text-lg mb-4">1. 현재 상태를 선택해주세요</h3>

                <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
                    <label class="cursor-pointer">
                        <input type="radio" name="condition" value="피곤함" checked class="peer hidden">
                        <div class="peer-checked:border-rose-500 peer-checked:bg-rose-50 border-2 border-slate-100 rounded-3xl p-5 text-center">
                            <div class="text-3xl">😫</div>
                            <div class="mt-2 font-black">피곤함</div>
                            <p class="text-xs text-slate-500 mt-1">지치고 힘들어요</p>
                        </div>
                    </label>

                    <label class="cursor-pointer">
                        <input type="radio" name="condition" value="비" class="peer hidden">
                        <div class="peer-checked:border-rose-500 peer-checked:bg-rose-50 border-2 border-slate-100 rounded-3xl p-5 text-center">
                            <div class="text-3xl">🌧️</div>
                            <div class="mt-2 font-black">비</div>
                            <p class="text-xs text-slate-500 mt-1">비가 와요</p>
                        </div>
                    </label>

                    <label class="cursor-pointer">
                        <input type="radio" name="condition" value="혼잡 회피" class="peer hidden">
                        <div class="peer-checked:border-rose-500 peer-checked:bg-rose-50 border-2 border-slate-100 rounded-3xl p-5 text-center">
                            <div class="text-3xl">👥</div>
                            <div class="mt-2 font-black">혼잡 회피</div>
                            <p class="text-xs text-slate-500 mt-1">사람 많은 곳은 피하고 싶어요</p>
                        </div>
                    </label>

                    <label class="cursor-pointer">
                        <input type="radio" name="condition" value="야근" class="peer hidden">
                        <div class="peer-checked:border-rose-500 peer-checked:bg-rose-50 border-2 border-slate-100 rounded-3xl p-5 text-center">
                            <div class="text-3xl">🌙</div>
                            <div class="mt-2 font-black">야근</div>
                            <p class="text-xs text-slate-500 mt-1">늦은 귀가 예정</p>
                        </div>
                    </label>
                </div>
            </div>

            <div class="grid md:grid-cols-2 gap-6">
                <div>
                    <h3 class="font-black text-lg mb-4">2. 이동 목적을 선택해주세요</h3>

                    <div class="grid grid-cols-3 gap-3">
                        <label class="cursor-pointer">
                            <input type="radio" name="purpose" value="퇴근" checked class="peer hidden">
                            <div class="peer-checked:border-rose-500 peer-checked:bg-rose-50 border-2 border-slate-100 rounded-2xl py-4 text-center font-bold">
                                퇴근
                            </div>
                        </label>

                        <label class="cursor-pointer">
                            <input type="radio" name="purpose" value="출근" class="peer hidden">
                            <div class="peer-checked:border-rose-500 peer-checked:bg-rose-50 border-2 border-slate-100 rounded-2xl py-4 text-center font-bold">
                                출근
                            </div>
                        </label>

                        <label class="cursor-pointer">
                            <input type="radio" name="purpose" value="외출" class="peer hidden">
                            <div class="peer-checked:border-rose-500 peer-checked:bg-rose-50 border-2 border-slate-100 rounded-2xl py-4 text-center font-bold">
                                외출
                            </div>
                        </label>
                    </div>
                </div>

                <div>
                    <h3 class="font-black text-lg mb-4">3. 현재 지역을 선택해주세요</h3>

                    <select id="areaSelect"
                            name="areaCode"
                            class="w-full border-2 border-rose-100 rounded-2xl p-4 bg-white font-bold">
                        <option th:each="area : ${areas}"
                                th:value="${area.areaCode}"
                                th:text="${area.areaName}"
                                th:attr="data-name=${area.areaName}">
                            광화문·덕수궁
                        </option>
                    </select>

                    <input type="hidden" id="areaNameInput" name="areaName">
                </div>
            </div>

            <button type="submit"
                    class="w-full bg-rose-500 hover:bg-rose-600 text-white rounded-2xl py-5 text-xl font-black shadow-lg">
                AI 전략 추천받기 →
            </button>

        </form>
    </section>

</main>

<script>
    const areaSelect = document.getElementById("areaSelect");
    const areaNameInput = document.getElementById("areaNameInput");

    function syncAreaName() {
        const selected = areaSelect.options[areaSelect.selectedIndex];
        areaNameInput.value = selected.dataset.name;
        console.log("test")
        console.log(selected.dataset.name)
        console.log(areaNameInput.value)
    }

    syncAreaName();
    areaSelect.addEventListener("change", syncAreaName);
</script>

</body>
</html>
