<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>MOBIUS AI Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-[#fff7f7] text-slate-900 flex items-center justify-center px-4">

<main class="w-full max-w-[480px]">

    <header class="text-center mb-8">
        <div class="text-5xl font-black text-rose-500">M</div>
        <h1 class="text-3xl font-black mt-2">MOBIUS AI</h1>
        <p class="text-slate-500 mt-1">AI 이동 전략 비서</p>
    </header>

    <section class="bg-white rounded-[2rem] p-8 shadow-sm border border-rose-100">

        <h2 class="text-2xl font-black">로그인</h2>
        <p class="text-slate-500 mt-2">계정으로 서비스를 이용해보세요.</p>

        <form id="loginForm" class="mt-8 space-y-5">

            <div>
                <label class="block text-sm font-bold mb-2">이메일</label>
                <input name="email"
                       type="email"
                       required
                       placeholder="user@example.com"
                       class="w-full border-2 border-rose-100 rounded-2xl px-4 py-4 outline-none focus:border-rose-500"/>
            </div>

            <div>
                <div class="flex justify-between mb-2">
                    <label class="block text-sm font-bold">비밀번호</label>
                    <button type="button"
                            id="togglePw"
                            class="text-sm text-rose-500 font-bold">
                        표시
                    </button>
                </div>

                <input id="password"
                       name="password"
                       type="password"
                       required
                       placeholder="••••••••"
                       class="w-full border-2 border-rose-100 rounded-2xl px-4 py-4 outline-none focus:border-rose-500"/>
            </div>

            <button type="submit"
                    class="w-full bg-rose-500 hover:bg-rose-600 text-white rounded-2xl py-4 font-black text-lg shadow-lg">
                로그인
            </button>

            <p class="text-center text-sm text-slate-500">
                계정이 없으신가요?
                <a href="/signup" class="text-rose-500 font-bold">회원가입</a>
            </p>

        </form>
    </section>

</main>

<div id="toast"
     class="hidden fixed top-5 right-5 bg-rose-500 text-white px-5 py-3 rounded-2xl shadow-lg font-bold">
</div>

<script>
    const toggle = document.getElementById('togglePw');
    const pw = document.getElementById('password');
    const toast = document.getElementById('toast');

    toggle.addEventListener('click', () => {
        const show = pw.type === 'password';
        pw.type = show ? 'text' : 'password';
        toggle.textContent = show ? '숨기기' : '표시';
    });

    function showToast(message) {
        toast.textContent = message;
        toast.classList.remove('hidden');
        setTimeout(() => toast.classList.add('hidden'), 2500);
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const payload = Object.fromEntries(new FormData(e.target).entries());

        try {
            const res = await fetch('/v1/member/login', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });

            if (!res.ok) {
                showToast('로그인에 실패했습니다.');
                return;
            }

            const data = await res.json();

            if (data.token) {
                localStorage.setItem('jwt', data.token);
            }

            showToast('로그인 성공!');
            setTimeout(() => location.href = '/main', 700);

        } catch (err) {
            showToast('네트워크 오류가 발생했습니다.');
        }
    });
</script>

</body>
</html>
