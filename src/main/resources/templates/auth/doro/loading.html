<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>분석 중</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-[#fff7f7] flex items-center justify-center text-slate-900">

<main class="max-w-xl w-full bg-white rounded-[2rem] p-12 shadow-sm text-center">

    <div class="text-6xl mb-6">🚗</div>

    <h1 class="text-3xl font-black">
        실시간 데이터를 분석 중이에요
    </h1>

    <p class="mt-3 text-slate-500">
        잠시만 기다려주세요.
    </p>

    <div class="mt-10 flex items-center justify-between">
        <div class="text-center">
            <div class="w-10 h-10 rounded-full bg-rose-500 text-white flex items-center justify-center font-bold">✓
            </div>
            <p class="text-sm mt-2">데이터 수집</p>
        </div>

        <div class="flex-1 h-1 bg-rose-200 mx-3"></div>

        <div class="text-center">
            <div class="w-10 h-10 rounded-full bg-rose-500 text-white flex items-center justify-center font-bold">2
            </div>
            <p class="text-sm mt-2">AI 분석</p>
        </div>

        <div class="flex-1 h-1 bg-slate-200 mx-3"></div>

        <div class="text-center">
            <div class="w-10 h-10 rounded-full bg-slate-200 flex items-center justify-center font-bold">3</div>
            <p class="text-sm mt-2">전략 생성</p>
        </div>
    </div>

    <p class="mt-10 text-sm text-slate-500">
        실시간 도시 데이터를 기반으로 최적의 이동 전략을 만들고 있어요.
    </p>

</main>

</body>
</html>
