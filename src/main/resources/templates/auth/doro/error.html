<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MOBIUS AI 오류</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-[#fff7f7] text-slate-900 flex items-center justify-center">

<main class="max-w-3xl w-full mx-auto px-6">

    <section class="bg-white rounded-[2rem] p-12 shadow-sm text-center">
        <div class="text-7xl">⚠️</div>

        <h1 class="text-4xl font-black mt-6" th:text="${errorTitle}">
            문제가 발생했습니다
        </h1>

        <p class="mt-4 text-slate-500"
           th:text="${errorMessage}">
            데이터를 불러오는 중 오류가 발생했어요.
        </p>

        <div class="mt-10 flex justify-center gap-4">
            <a href="/main"
               class="border border-rose-500 text-rose-500 px-8 py-4 rounded-2xl font-black">
                홈으로 돌아가기
            </a>
        </div>
    </section>

</main>

</body>
</html>
