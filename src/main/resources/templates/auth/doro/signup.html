<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>MOBIUS AI 회원가입</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="min-h-screen bg-[#fff7f7] text-slate-900 flex items-center justify-center px-4">

<main class="w-full max-w-[520px]">

    <header class="text-center mb-8">
        <div class="text-5xl font-black text-rose-500">M</div>
        <h1 class="text-3xl font-black mt-2">MOBIUS AI</h1>
        <p class="text-slate-500 mt-1">AI 이동 전략 비서 시작하기</p>
    </header>

    <section class="bg-white rounded-[2rem] p-8 shadow-sm border border-rose-100">

        <h2 class="text-2xl font-black">회원가입</h2>
        <p class="text-slate-500 mt-2">이메일과 비밀번호를 입력해주세요.</p>

        <form id="signupForm" class="mt-8 space-y-5">

            <div>
                <label class="block text-sm font-bold mb-2">사용자명</label>
                <input id="name"
                       name="name"
                       type="text"
                       required
                       placeholder="가입자명"
                       class="w-full border-2 border-rose-100 rounded-2xl px-4 py-4 outline-none focus:border-rose-500"/>
            </div>

            <div>
                <label class="block text-sm font-bold mb-2">이메일</label>
                <input id="email"
                       name="email"
                       type="email"
                       required
                       placeholder="you@example.com"
                       class="w-full border-2 border-rose-100 rounded-2xl px-4 py-4 outline-none focus:border-rose-500"/>
            </div>

            <div>
                <label class="block text-sm font-bold mb-2">비밀번호</label>
                <input id="password"
                       name="password"
                       type="password"
                       required
                       placeholder="8자 이상"
                       class="w-full border-2 border-rose-100 rounded-2xl px-4 py-4 outline-none focus:border-rose-500"/>
                <p id="strengthHint" class="text-xs text-slate-500 mt-2">
                    영문, 숫자, 특수문자를 조합하여 8자 이상으로 설정해주세요.
                </p>
            </div>

            <div>
                <label class="block text-sm font-bold mb-2">비밀번호 확인</label>
                <input id="confirm"
                       name="confirm"
                       type="password"
                       required
                       placeholder="다시 입력"
                       class="w-full border-2 border-rose-100 rounded-2xl px-4 py-4 outline-none focus:border-rose-500"/>
            </div>

            <p id="errorBox" class="text-sm text-red-500 min-h-[20px]"></p>
            <p id="okBox" class="text-sm text-emerald-500 min-h-[20px]"></p>

            <button id="submitBtn"
                    type="submit"
                    class="w-full bg-rose-500 hover:bg-rose-600 text-white rounded-2xl py-4 font-black text-lg shadow-lg">
                가입하기
            </button>

            <p class="text-center text-sm text-slate-500">
                이미 계정이 있으신가요?
                <a href="/login" class="text-rose-500 font-bold">로그인</a>
            </p>

        </form>
    </section>

</main>

<script>
    const form = document.getElementById('signupForm');
    const submitBtn = document.getElementById('submitBtn');
    const errorBox = document.getElementById('errorBox');
    const okBox = document.getElementById('okBox');
    const pwEl = document.getElementById('password');
    const strengthHint = document.getElementById('strengthHint');

    function strength(pw) {
        let score = 0;
        if (pw.length >= 8) score++;
        if (/[A-Z]/.test(pw)) score++;
        if (/[0-9]/.test(pw)) score++;
        if (/[^A-Za-z0-9]/.test(pw)) score++;
        return score;
    }

    pwEl.addEventListener('input', () => {
        const labels = ['매우 약함', '약함', '보통', '좋음', '아주 좋음'];
        strengthHint.textContent = pwEl.value
            ? `비밀번호 강도: ${labels[strength(pwEl.value)]}`
            : '영문, 숫자, 특수문자를 조합하여 8자 이상으로 설정해주세요.';
    });

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const payload = Object.fromEntries(new FormData(form).entries());

        errorBox.textContent = '';
        okBox.textContent = '';

        if (payload.password.length < 8) {
            errorBox.textContent = '비밀번호는 8자 이상이어야 합니다.';
            return;
        }

        if (payload.password !== payload.confirm) {
            errorBox.textContent = '비밀번호 확인이 일치하지 않습니다.';
            return;
        }

        submitBtn.disabled = true;

        try {
            const res = await fetch('/v1/member/join', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Accept': 'application/json'
                },
                body: JSON.stringify({
                    name: payload.name,
                    email: payload.email,
                    password: payload.password
                })
            });

            if (res.ok || res.status === 201) {
                okBox.textContent = '가입이 완료되었습니다.';
                setTimeout(() => location.href = '/', 800);
            } else {
                const msg = await res.text();
                errorBox.textContent = msg || '가입에 실패했습니다.';
            }

        } catch (err) {
            errorBox.textContent = '네트워크 오류가 발생했습니다.';
        } finally {
            submitBtn.disabled = false;
        }
    });
</script>

</body>
</html>
