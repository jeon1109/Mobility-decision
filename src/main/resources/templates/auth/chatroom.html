<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Chat Room</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --bg: #0a0f1f;
            --bg2: #0c142b;
            --muted: #9aa4b2;
            --text: #e7e8ea;
            --primary: #2563ff;
            --primary-2: #1b4ee1;
            --ring: rgba(37, 99, 255, .35);
            --border: rgba(255, 255, 255, .06);
            --glow: 0 0 0 1px rgba(255, 255, 255, .04),
            0 10px 30px rgba(0, 0, 0, .45),
            0 0 40px rgba(37, 99, 255, .08);
            --inset: inset 0 1px 0 rgba(255, 255, 255, .05),
            inset 0 0 0 1px rgba(255, 255, 255, .04),
            0 10px 25px rgba(0, 0, 0, .45);
        }

        html, body {
            height: 100%;
        }

        body {
            margin: 0;
            background: radial-gradient(1200px 600px at 20% -10%, #1a2a6c40, transparent),
            radial-gradient(1000px 600px at 110% 10%, #0f9b8e25, transparent),
            radial-gradient(900px 500px at 50% 110%, #2563ff20, transparent),
            linear-gradient(160deg, #0a0f1f 0%, #0a0f1f 20%, #0b1224 80%);
            color: var(--text);
        }

        .card {
            background: linear-gradient(180deg, rgba(255, 255, 255, .02), rgba(255, 255, 255, .01));
            border: 1px solid var(--border);
            box-shadow: var(--glow);
            backdrop-filter: blur(12px);
        }

        .input {
            background: linear-gradient(180deg, rgba(255, 255, 255, .04), rgba(255, 255, 255, .02));
            border: 1px solid var(--border);
            color: var(--text);
            outline: none;
            box-shadow: var(--inset);
        }

        .input:focus {
            border-color: transparent;
            box-shadow: 0 0 0 8px var(--ring), var(--inset);
        }

        .btn {
            background: linear-gradient(180deg, var(--primary), var(--primary-2));
            color: #eaf0ff;
            box-shadow: 0 8px 24px rgba(37, 99, 255, .35);
            transition: 0.2s;
        }

        .btn:hover {
            filter: brightness(1.05);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .msgArea {
            height: 500px;
            overflow-y: auto;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message-row {
            display: flex;
            flex-direction: column;
            max-width: 75%;
        }

        .message-row.me {
            align-self: flex-end;
            align-items: flex-end;
        }

        .message-row.other {
            align-self: flex-start;
            align-items: flex-start;
        }

        .sender {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .bubble {
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.4;
            word-break: break-word;
            box-shadow: 0 8px 20px rgba(0, 0, 0, .22);
        }

        .me .bubble {
            background: linear-gradient(180deg, var(--primary), var(--primary-2));
            color: #fff;
            border-bottom-right-radius: 6px;
        }

        .other .bubble {
            background: rgba(255, 255, 255, 0.06);
            color: var(--text);
            border: 1px solid var(--border);
            border-bottom-left-radius: 6px;
        }

        .system-message {
            align-self: center;
            font-size: 13px;
            color: var(--muted);
            background: rgba(255, 255, 255, .04);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 999px;
        }

        .chat-input-wrap {
            display: flex;
            gap: 12px;
            padding: 16px;
            border-top: 1px solid rgba(255, 255, 255, .06);
            align-items: center;
        }

        .file-btn {
            background: rgba(255, 255, 255, 0.08);
            color: var(--text);
            border: 1px solid var(--border);
            box-shadow: var(--inset);
            transition: 0.2s;
        }

        .file-btn:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .file-name {
            font-size: 12px;
            color: var(--muted);
            min-width: 120px;
            max-width: 180px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .toast {
            position: fixed;
            top: 20px;
            right: 20px;
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: #fff;
            padding: 14px 18px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 6px 20px rgba(0, 0, 0, .25);
            opacity: 0;
            transform: translateY(-20px);
            transition: opacity .3s ease, transform .3s ease;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center px-4 py-8">

<main class="w-full max-w-4xl">
    <section class="card rounded-3xl overflow-hidden">
        <!-- 헤더 -->
        <div class="flex items-center justify-between px-6 py-5 border-b border-white/10">
            <div>
                <h1 class="text-2xl md:text-3xl font-semibold tracking-tight">실시간 채팅</h1>
            </div>
            <div class="text-sm text-slate-400">
                닉네임: <span id="userName" class="text-slate-200 font-medium"></span>
            </div>
        </div>

        <!-- 메시지 영역 -->
        <div class="msgArea"></div>

        <!-- 입력 영역 -->
        <div class="chat-input-wrap">
            <input
                    type="file"
                    id="fileInput"
                    class="hidden"
                    onchange="handleFileSelect(event)"
            />

            <button class="file-btn rounded-xl px-4 py-3 font-semibold" onclick="openFilePicker()">
                파일
            </button>

            <div id="fileName" class="file-name">선택된 파일 없음</div>

            <input
                    type="text"
                    class="content input flex-1 rounded-xl px-4 py-3 placeholder-slate-500"
                    placeholder="메시지를 입력하세요"
                    onkeydown="handleEnter(event)"
            />
            <button class="btn rounded-xl px-6 py-3 font-semibold" onclick="sendMsg()">전송</button>
        </div>
    </section>
</main>

<script>
    let userId = prompt("닉네임을 입력하세요") || "익명";
    document.getElementById("userName").innerText = userId;

    let selectedFile = null;

    let socket = new WebSocket("ws://localhost:9091/chat/" + userId);

    socket.onopen = function () {
        console.log("open server!");
        showToast("채팅 서버에 연결되었습니다.");
        addSystemMessage("채팅방에 입장했습니다.");
    };

    socket.onerror = function (e) {
        console.log(e);
        showToast("서버 연결 중 오류가 발생했습니다.");
    };

    socket.onclose = function () {
        addSystemMessage("서버와 연결이 종료되었습니다.");
    };

    socket.onmessage = function (e) {
        console.log(e.data);

        const msgArea = document.querySelector(".msgArea");
        const newMsg = document.createElement("div");

        const isMine = typeof e.data === "string" && e.data.startsWith(userId + ":");
        newMsg.className = "message-row " + (isMine ? "me" : "other");

        const sender = document.createElement("div");
        sender.className = "sender";

        const bubble = document.createElement("div");
        bubble.className = "bubble";

        if (typeof e.data === "string" && e.data.includes(":")) {
            const splitIndex = e.data.indexOf(":");
            const senderName = e.data.substring(0, splitIndex);
            const message = e.data.substring(splitIndex + 1).trim();

            sender.innerText = senderName;
            bubble.innerText = message;
        } else {
            sender.innerText = "알림";
            bubble.innerText = e.data;
        }

        newMsg.appendChild(sender);
        newMsg.appendChild(bubble);
        msgArea.appendChild(newMsg);
        msgArea.scrollTop = msgArea.scrollHeight;
    };

    function sendMsg() {
        const input = document.querySelector(".content");
        const content = input.value.trim();

        if (selectedFile) {
            sendFile();
            return;
        }

        if (!content) return;

        socket.send(content);
        input.value = "";
        input.focus();
    }

    function sendFile() {
        if (!selectedFile) return;

        if (socket.readyState !== WebSocket.OPEN) {
            showToast("서버와 연결되어 있지 않습니다.");
            return;
        }

        const fileLabel = `[파일] ${selectedFile.name} (${formatFileSize(selectedFile.size)})`;

        // 기존 서버와의 호환성을 위해 텍스트 메시지로 전송
        socket.send(fileLabel);

        addSystemMessage(`파일 선택됨: ${selectedFile.name}`);
        showToast("파일 정보가 전송되었습니다.");

        clearSelectedFile();
    }

    function handleEnter(event) {
        if (event.key === "Enter") {
            sendMsg();
        }
    }

    function openFilePicker() {
        document.getElementById("fileInput").click();
    }

    function handleFileSelect(event) {
        const file = event.target.files[0];
        if (!file) return;

        selectedFile = file;
        document.getElementById("fileName").innerText = file.name;
        showToast(`선택한 파일: ${file.name}`);
    }

    function clearSelectedFile() {
        selectedFile = null;
        document.getElementById("fileInput").value = "";
        document.getElementById("fileName").innerText = "선택된 파일 없음";
    }

    function formatFileSize(bytes) {
        if (bytes < 1024) return bytes + "B";
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + "KB";
        if (bytes < 1024 * 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + "MB";
        return (bytes / (1024 * 1024 * 1024)).toFixed(1) + "GB";
    }

    function addSystemMessage(message) {
        const msgArea = document.querySelector(".msgArea");
        const div = document.createElement("div");
        div.className = "system-message";
        div.innerText = message;
        msgArea.appendChild(div);
        msgArea.scrollTop = msgArea.scrollHeight;
    }

    function showToast(message, duration = 2500) {
        const toast = document.createElement("div");
        toast.className = "toast";
        toast.textContent = message;
        document.body.appendChild(toast);

        requestAnimationFrame(() => toast.classList.add("show"));

        setTimeout(() => {
            toast.classList.remove("show");
            setTimeout(() => toast.remove(), 300);
        }, duration);
    }
</script>

</body>
</html>
